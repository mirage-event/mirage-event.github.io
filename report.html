<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light only">
<link rel="icon" href="assets/favicon.png">
<title>تقرير الحدث · MIRAGE</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#05141d;--ink:#10232d;--mute:#5b7480;--line:#d5e3e8;--soft:#f2f8fa;--bar:#0f8fb0;--ok:#14915e;--warn:#b07800}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:#e9eff2}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--ink);line-height:1.55;font-size:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.en{font-family:Inter,sans-serif;direction:ltr;unicode-bidi:isolate}
.bar{position:sticky;top:0;display:flex;gap:10px;justify-content:center;padding:12px;background:var(--navy);z-index:2}
.bar button,.bar a{font:inherit;font-weight:600;border:0;border-radius:10px;padding:9px 18px;cursor:pointer;text-decoration:none;background:#1cc8ee;color:#022}
.bar .ghost{background:transparent;color:#eaf7fb;border:1px solid #2a5165}
.page{width:210mm;min-height:297mm;margin:18px auto;background:#fff;padding:14mm 15mm;box-shadow:0 4px 24px rgba(0,0,0,.08)}
@media (max-width:820px){.page{width:auto;min-height:0;margin:0;padding:18px 16px}}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:16px}
header img{height:15mm}
.kick{color:var(--bar);font-weight:600;font-size:12px;margin:0}
h1{font-size:22px;margin:2px 0 2px;color:var(--navy);line-height:1.3}
.sub{color:var(--mute);font-size:12.5px;margin:0}
h2{font-size:15px;color:var(--navy);margin:20px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .n{font-family:Inter,sans-serif;font-size:26px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{color:var(--mute);font-size:12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center}
th{white-space:normal;line-height:1.3;vertical-align:bottom}
th{background:var(--soft);color:var(--mute);font-weight:600;font-size:11.5px}
td:first-child,th:first-child{text-align:start;font-weight:600}
td{font-family:Inter,"IBM Plex Sans Arabic",sans-serif;font-variant-numeric:tabular-nums}
tr.tot td{border-top:2px solid var(--navy);font-weight:700}
.na{color:#b8c7cd}
.note{color:var(--mute);font-size:11.5px;margin:6px 0 0}
.sess{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.sess{grid-template-columns:1fr}}
.sbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.sbox b{display:block;color:var(--navy)}
.meter{height:8px;background:var(--soft);border-radius:8px;margin:10px 0 6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--bar);border-radius:8px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;transform:translate(-50%,-110%);white-space:nowrap}
footer{margin-top:22px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--mute);font-size:10.5px}
.msg{max-width:420px;margin:80px auto;text-align:center;background:#fff;border-radius:14px;padding:30px}
@media print{@page{size:A4;margin:0}html,body{background:#fff}.bar{display:none}.page{margin:0;box-shadow:none}.tip{display:none}}
</style>
</head><body>
<div class="bar"><button id="print">طباعة / حفظ PDF</button><button class="ghost" id="xlsx">تحميل Excel</button><a class="ghost" href="admin.html">رجوع للإدارة</a></div>
<div id="app"><p class="msg">جاري تحميل التقرير…</p></div>

<script src="config.js"></script>
<script src="assets/api.js"></script>
<script src="assets/vendor/xlsx.mini.min.js"></script>
<script src="assets/reports.js"></script>
<script>
const app = document.getElementById('app');
let EV = null, REGS = [];
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '—';

function chart(regs, sess){
  const d = RPT.arrivals(regs, sess);
  const head = `<b style="color:var(--navy);font-size:13px">${SESS_AR[sess]}</b>`;
  if (!d.length) return `<div>${head}<p class="note">لا يوجد دخول مسجّل بعد.</p></div>`;
  const W = 360, H = 190, L = 34, B = 26, T = 18, max = Math.max(...d.map(x => x.n));
  const step = Math.max(1, Math.ceil(max / 4)), top = step * Math.ceil(max / step);
  const bw = (W - L - 8) / d.length, y = v => T + (H - T - B) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#e3ecef"/><text x="${L - 6}" y="${y(v) + 4}" font-size="10" fill="#5b7480" text-anchor="end">${v}</text>`;
  const best = d.reduce((a, b) => b.n > a.n ? b : a);
  const bars = d.map((x, i) => {
    const bx = L + 4 + i * bw, h = y(0) - y(x.n), w = Math.max(2, bw - 2);
    const r = Math.min(4, w / 2, h);
    const path = x.n ? `M${bx},${y(0)} V${y(x.n) + r} Q${bx},${y(x.n)} ${bx + r},${y(x.n)} H${bx + w - r} Q${bx + w},${y(x.n)} ${bx + w},${y(x.n) + r} V${y(0)} Z` : '';
    const lab = x.min % 30 === 0 ? `<text x="${bx + w / 2}" y="${H - 8}" font-size="10" fill="#5b7480" text-anchor="middle" font-family="Inter">${RPT.hhmm(x.min)}</text>` : '';
    const top = x === best ? `<text x="${bx + w / 2}" y="${y(x.n) - 5}" font-size="10.5" font-weight="700" fill="#10232d" text-anchor="middle" font-family="Inter">${x.n}</text>` : '';
    return `<g class="b" data-t="${RPT.hhmm(x.min)}–${RPT.hhmm(x.min + 15)}: ${x.n} دخول"><rect x="${bx - 1}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"/>${path ? `<path d="${path}" fill="#0f8fb0"/>` : ''}${top}${lab}</g>`;
  }).join('');
  return `<div>${head}<div class="chart"><svg viewBox="0 0 ${W} ${H}" direction="ltr" role="img" aria-label="عدد الداخلين لكل ربع ساعة">${g}<line x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#9fb4bd"/>${bars}</svg><div class="tip" hidden></div></div>
    <p class="note">الذروة ${RPT.hhmm(best.min)}: ${best.n} دخول.</p></div>`;
}

function render(){
  const st = RPT.stats(REGS), a = st.all;
  const row = (k, label) => { const x = st[k];
    return `<tr class="${k === 'all' ? 'tot' : ''}"><td>${label}</td><td>${x.total}</td><td>${x.pending}</td><td>${x.rejected}</td><td>${x.approved}</td><td>${x.declined}</td>
      <td>${k === 'public' ? '<span class="na">—</span>' : x.am}</td><td>${k === 'vip' ? '<span class="na">—</span>' : x.pm}</td><td>${x.attended}</td><td>${x.noshow}</td><td><b>${pct(x.attended, x.approved)}</b></td></tr>`; };
  const sess = s => { const exp = a[s === 'am' ? 'expAm' : 'expPm'], got = a[s];
    return `<div class="sbox"><b>${SESS_AR[s]}${sessTime(EV, s) ? ' — ' + esc(sessTime(EV, s)) : ''}</b>
      <span class="sub">${s === 'am' ? 'VIP + الإعلام' : 'الضيوف + الإعلام'}</span>
      <div class="meter"><i style="width:${exp ? Math.min(100, 100 * got / exp) : 0}%"></i></div>
      <span class="en" style="font-weight:700">${got}</span> حضروا من <span class="en">${exp}</span> معتمد (${pct(got, exp)})</div>`; };
  document.title = 'تقرير — ' + EV.name_ar;
  app.innerHTML = `<section class="page">
    <header><div><p class="kick">تقرير الحدث · Event Report</p><h1>${esc(EV.name_ar)}</h1>
      <p class="sub">${esc(fmtAr(EV.date))}${EV.venue_ar ? ' · ' + esc(EV.venue_ar) : ''} · أُعدّ في ${new Date().toLocaleString('ar-LY', { dateStyle: 'medium', timeStyle: 'short' })}</p></div>
      <img src="assets/logo-dark.png" alt="MIRAGE Smart City"></header>
    <div class="kpis">
      <div class="kpi"><div class="n">${a.total}</div><div class="l">إجمالي المسجلين</div></div>
      <div class="kpi"><div class="n">${a.approved}</div><div class="l">معتمدون</div></div>
      <div class="kpi"><div class="n">${a.attended}</div><div class="l">حضروا (أي فترة)</div></div>
      <div class="kpi"><div class="n">${pct(a.attended, a.approved)}</div><div class="l">نسبة الحضور من المعتمدين</div></div>
    </div>
    <h2>حسب نوع الدعوة</h2>
    <div class="tw"><table>
      <tr><th>النوع</th><th>المسجلون</th><th>قيد المراجعة</th><th>مرفوض</th><th>معتمد</th><th>معتمد واعتذر</th><th>حضروا الصباحية</th><th>حضروا المسائية</th><th>حضروا</th><th>لم يحضروا</th><th>نسبة الحضور</th></tr>
      ${row('vip', 'VIP')}${row('press', 'إعلام')}${row('public', 'ضيوف')}${row('all', 'الإجمالي')}
    </table></div>
    <p class="note">«حضروا» = مُسح في أي فترة. «لم يحضروا» = معتمدون لم يُمسحوا. «—» = الفترة غير مخصصة لهذا النوع. الإعلام يُحسب في الفترتين.</p>
    <h2>حسب الفترة</h2>
    <div class="sess">${sess('am')}${sess('pm')}</div>
    <h2>منحنى الوصول <span class="sub" style="font-weight:400">— عدد المسحات عند البوابة لكل ربع ساعة</span></h2>
    <div class="sess">${chart(REGS, 'am')}${chart(REGS, 'pm')}</div>
    <footer><span class="en">MIRAGE Smart City · AL MIRAGE DEVELOPMENTS</span><span>منظومة MIRAGE RSVP</span></footer>
  </section>`;
  document.querySelectorAll('.chart').forEach(ch => { const tip = ch.querySelector('.tip');
    ch.querySelectorAll('.b').forEach(b => { b.addEventListener('mousemove', e => { const r = ch.getBoundingClientRect(); tip.textContent = b.dataset.t; tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px'; tip.hidden = false; });
      b.addEventListener('mouseleave', () => tip.hidden = true); }); });
}

document.getElementById('print').onclick = () => print();
document.getElementById('xlsx').onclick = () => EV && RPT.excelFull(EV, REGS);

(async () => {
  const S = store.get('mrg_admin_s');
  if (!S) { location.replace('admin.html'); return; }
  try {
    const e = await API.post({ a: 'events', s: S });
    if (e.error === 'auth') { store.set('mrg_admin_s', null); location.replace('admin.html'); return; }
    const want = store.get('mrg_admin_ev');
    EV = (e.events || []).find(x => x.code === want) || (e.events || [])[0];
    if (!EV) { app.innerHTML = '<p class="msg">لا يوجد حدث.</p>'; return; }
    const d = await API.post({ a: 'list', s: S, event: EV.code });
    REGS = d.regs || []; render();
  } catch (_) { app.innerHTML = '<p class="msg">تعذّر تحميل التقرير. تأكد من الاتصال.</p>'; }
})();
</script>
</body></html>
