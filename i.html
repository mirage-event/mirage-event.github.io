<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="color-scheme" content="dark only"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#05141d">
<meta property="og:type" content="website"><meta property="og:site_name" content="MIRAGE Smart City"><meta property="og:title" content="بطاقة الدخول — MIRAGE Smart City"><meta property="og:description" content="بطاقة دخولكم الشخصية مع رمز QR."><meta property="og:image" content="https://mirage-event.github.io/assets/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.png">
<title>بطاقة الدخول · MIRAGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/guest.css">
</head><body>
<img class="mark" src="assets/logo-full.png" alt="MIRAGE Smart City">
<div id="app" style="width:100%;display:flex;flex-direction:column;align-items:center"><div class="loading"><div class="spin"></div>جاري التحميل…</div></div>

<script src="config.js"></script>
<script src="assets/api.js"></script>
<script src="assets/vendor/qrcode.js"></script>
<script src="assets/vendor/html2canvas.min.js"></script>
<script>
const app = document.getElementById('app');
const token = (new URLSearchParams(location.search).get('t') || '').toLowerCase();
const myUrl = () => siteBase() + 'i.html?t=' + token;
let D = null;

function msg(title, text){ app.innerHTML = `<div class="panel" style="text-align:center"><h1>${esc(title)}</h1><p class="desc">${esc(text)}</p><p class="note en">www.almirage.ly</p></div>`; }

function evLine(ev, type){ return `${esc(fmtAr(ev.date))} · ${esc(typeTimesText(ev, type))}${ev.venue_ar ? ' · ' + esc(ev.venue_ar) : ''}`; }

function saveBox(){
  return `<div class="savebox">احفظ هذا الرابط — منه تتابع حالة طلبك وتستلم بطاقة الدخول:
    <div class="url">${esc(myUrl())}</div>
    <button class="ghost" style="font-size:14px;padding:10px" id="copy">نسخ الرابط</button></div>`;
}
function bindCopy(){
  document.getElementById('copy')?.addEventListener('click', e => navigator.clipboard.writeText(myUrl()).then(() => { e.target.textContent = 'تم النسخ ✓'; }));
}

function pendingView(){
  const { event: ev, reg: r } = D;
  app.innerHTML = `<div class="panel" style="text-align:center">
    <div class="state-icon pending">⏳</div>
    <h1>طلبك قيد المراجعة</h1>
    <p class="desc" style="margin-bottom:6px">شكراً ${esc(r.name)}، تم استلام تسجيلكم في <b>${esc(ev.name_ar)}</b>.<br>سيتم إشعاركم فور اعتماد الطلب، وتظهر بطاقة الدخول في هذه الصفحة.</p>
    <p class="note" style="margin:0 0 4px">${evLine(ev, r.type)}</p>
    ${saveBox()}
    <p class="note" style="margin:10px 0 0">إذا أدخلتم بريداً إلكترونياً، تصلكم البطاقة عليه أيضاً — يُرجى التحقق من مجلد الرسائل غير المرغوب فيها (Spam).</p>
    <button class="link" id="refresh">تحديث الحالة</button>
    <p class="note">رقم الطلب: <span class="en">${esc(r.badge)}</span></p></div>`;
  bindCopy(); document.getElementById('refresh').onclick = load;
}

function rejectedView(){
  const { event: ev } = D;
  app.innerHTML = `<div class="panel" style="text-align:center">
    <div class="state-icon bad">✕</div><h1>نعتذر</h1>
    <p class="desc">لم يتم اعتماد طلب التسجيل في <b>${esc(ev.name_ar)}</b> نظراً لمحدودية المقاعد. نشكر اهتمامكم ونأمل لقاءكم في مناسبات قادمة.</p></div>`;
}

function declinedView(){
  const { event: ev } = D;
  app.innerHTML = `<div class="panel" style="text-align:center">
    <div class="state-icon ok">✓</div><h1>تم تسجيل اعتذاركم</h1>
    <p class="desc">نشكركم على الرد بخصوص <b>${esc(ev.name_ar)}</b>. إن تغيّرت ظروفكم يمكنكم تأكيد الحضور من هنا.</p>
    <button class="primary" data-att="yes">أؤكد حضوري</button></div>`;
}

function badgeView(){
  const { event: ev, reg: g } = D, look = TYPE_LOOK[g.type] || TYPE_LOOK.public, map = safeUrl(ev.map_url);
  const role = [g.title, g.org].filter(Boolean).join(' · ');
  app.innerHTML = `
    <p class="confirmed">✓ ${g.attend === 'maybe' ? 'بطاقة دخولكم جاهزة — نأمل تأكيد حضوركم' : 'هذه بطاقة دخولكم'}</p>
    <div class="badge" id="badge">
      <div class="b-top"><div class="b-slot"></div>
        <div class="b-head">
          <div class="b-ev"><strong>${esc(ev.name_ar)}</strong>${ev.name_en ? `<span>${esc(ev.name_en)}</span>` : ''}</div>
          <img class="b-mark" src="assets/logo-full.png" alt="MIRAGE Smart City">
        </div>
        <div class="b-person"><div class="b-name">${esc(g.name)}</div>${role ? `<div class="b-role">${esc(role)}</div>` : ''}</div>
      </div>
      <div class="b-cat" style="background:${look.color}"><span class="ar">${look.ar}</span><span class="en">${look.en}</span></div>
      <div class="b-mid"><div class="b-qr" id="qr"></div>
        <div class="b-id"><div class="l">رقم البطاقة</div><div class="v">${esc(g.badge)}</div>
          <div class="s">يُرجى إبراز الرمز عند البوابة.<br>بطاقة شخصية غير قابلة للتحويل.</div></div></div>
      <div class="b-bot">
        <div><div class="l">التاريخ</div><div class="v">${esc(fmtAr(ev.date))}</div><div class="ven">${esc(fmtEn(ev.date))}</div></div>
        <div><div class="l">المكان</div><div class="v">${esc(ev.venue_ar || '—')}</div><div class="ven">${esc((ev.venue_en || '').toUpperCase())}</div></div>
        ${typeSessions(ev, g.type).map(x => `<div><div class="l">${esc(x.label)}</div><div class="v">${esc(x.time || '—')}</div></div>`).join('')}
      </div>
      <div class="b-foot"><span>WWW.ALMIRAGE.LY</span><span>AL MIRAGE DEVELOPMENTS</span></div>
    </div>
    <div class="badge-actions">
      <button class="primary" id="dl">حفظ البطاقة كصورة</button>
      <div class="row2"><button class="ghost" id="cal">إضافة للتقويم</button>
        ${map ? `<a class="btn ghost" href="${esc(map)}" target="_blank" rel="noopener">الموقع</a>` : `<button class="ghost" onclick="print()">طباعة</button>`}</div>
      ${g.attend === 'maybe' ? '<button class="ghost" data-att="yes">أؤكد حضوري</button>' : ''}
      <button class="link" data-att="no">لن أتمكن من الحضور</button>
    </div>`;
  drawQR('MIRAGE:' + g.gate);   // not a link: only the gate scanner understands it
  if (SAMSUNG) flatten();
  document.getElementById('dl').onclick = async () => {
    const shown = document.getElementById('badgeImg');
    const c = shown || await html2canvas(document.getElementById('badge'), { scale: 3, backgroundColor: null });
    const a = document.createElement('a'); a.download = g.badge + '.png'; a.href = c.toDataURL('image/png'); a.click();
  };
  document.getElementById('cal').onclick = () => {
    const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MIRAGE//RSVP//AR','BEGIN:VEVENT','UID:' + token + '@almirage.ly',
      'DTSTART;VALUE=DATE:' + ev.date.replace(/-/g,''), 'SUMMARY:' + ev.name_ar, 'LOCATION:' + (ev.venue_ar || ''),
      'URL:' + myUrl(), 'END:VEVENT','END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar'})); a.download = 'mirage-event.ics'; a.click();
  };
}

const SAMSUNG = /SamsungBrowser/i.test(navigator.userAgent);
// Samsung Internet's forced dark mode dims every element and image, but leaves <canvas> untouched.
// So on Samsung we paint the badge (and the page logo) into a canvas and show that instead.
async function flatten(){
  try {
    await (document.fonts ? document.fonts.ready : Promise.resolve());
    await Promise.all([...document.querySelectorAll('#badge img')].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    const el = document.getElementById('badge'); if (!el) return;
    const c = await html2canvas(el, { scale: 3, backgroundColor: null });
    c.id = 'badgeImg'; c.className = 'badge'; c.style.width = el.offsetWidth + 'px'; c.style.height = el.offsetHeight + 'px';
    c.style.maxWidth = '100%'; c.style.height = 'auto'; c.style.display = 'block';
    el.replaceWith(c);
  } catch (e) { /* keep the HTML badge if anything fails */ }
}
function flattenLogo(){
  const img = document.querySelector('img.mark'); if (!img) return;
  const go = () => { const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext('2d').drawImage(img, 0, 0); c.className = 'mark'; c.style.height = 'auto'; c.setAttribute('aria-label', img.alt); img.replaceWith(c); };
  img.complete ? go() : img.addEventListener('load', go);
}
if (SAMSUNG) flattenLogo();

function drawQR(text){
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), px = 8, m = 2, c = document.createElement('canvas'); c.width = c.height = (n + m*2) * px;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.fillStyle = '#05141d';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r,k)) x.fillRect((k+m)*px,(r+m)*px,px,px);
  document.getElementById('qr').appendChild(c);
}

function render(){
  const r = D.reg; document.title = D.event.name_ar + ' · MIRAGE';
  if (r.status === 'rejected') return rejectedView();
  if (r.status === 'pending') return pendingView();
  if (r.attend === 'no') return declinedView();
  badgeView();
}

app.addEventListener('click', async e => {
  const b = e.target.closest('[data-att]'); if (!b) return;
  if (b.dataset.att === 'no' && !confirm('تأكيد الاعتذار عن الحضور؟')) return;
  b.disabled = true;
  try { const d = await API.post({ a: 'attend', t: token, v: b.dataset.att }); if (d.ok) { D = d; render(); } else throw 0; }
  catch (_) { alert('تعذّر الحفظ. حاول مرة أخرى.'); b.disabled = false; }
});

async function load(){
  if (!/^[a-f0-9]{32}$/.test(token)) return msg('الرابط غير صالح', 'تأكد من الرابط أو تواصل مع فريق التنظيم.');
  if (!API.configured()) return msg('الموقع غير مُعدّ', 'لم يتم ربط الموقع بالـ Google Sheet بعد.');
  try {
    const d = await API.get({ a: 'status', t: token });
    if (!d.ok) return msg('الرابط غير صالح', 'تعذّر العثور على هذا التسجيل. تأكد من الرابط أو تواصل مع فريق التنظيم.');
    D = d; render();
  } catch (_) { msg('تعذّر التحميل', 'تأكد من اتصالك بالإنترنت ثم أعد فتح الرابط.'); }
}
load();
</script>
</body></html>
