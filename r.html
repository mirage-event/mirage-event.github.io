<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#05141d">
<link rel="icon" href="assets/favicon.png">
<title>التسجيل · MIRAGE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/guest.css">
</head><body>
<img class="mark" src="assets/logo-full.png" alt="MIRAGE Smart City">
<div id="app" style="width:100%;display:flex;justify-content:center"><div class="loading"><div class="spin"></div>جاري التحميل…</div></div>

<script src="config.js"></script>
<script src="assets/api.js"></script>
<script>
const app = document.getElementById('app');
const qs = new URLSearchParams(location.search);
const VIP = (qs.get('v') || '').toLowerCase(), EV = (qs.get('e') || '').toUpperCase();
const I = {
  user: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  phone:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>',
  mail: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  bag:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg>',
  org:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M16 9h2a2 2 0 0 1 2 2v10M2 21h20M8 7h4M8 11h4M8 15h4"/></svg>',
  cal:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  pin:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
};
const state = { gender: '', attend: '' };

function msg(title, text){
  app.innerHTML = `<div class="panel" style="text-align:center"><h1>${esc(title)}</h1><p class="desc">${esc(text)}</p><p class="note en">www.almirage.ly</p></div>`;
}
function goBadge(token){ location.replace('i.html?t=' + encodeURIComponent(token)); }

function render(ctx){
  const ev = ctx.event, isVip = ctx.type === 'vip', map = safeUrl(ev.map_url);
  document.title = ev.name_ar + ' · التسجيل';
  app.innerHTML = `<div class="reg">
    <section class="reg-info">
      ${isVip ? '<div class="vip-tag">دعوة خاصة <span class="en">VIP</span></div>' : '<p class="kicker">التسجيل في الحدث · Registration</p>'}
      <h1>${esc(ev.name_ar)}</h1>${ev.name_en ? `<p class="h1en en">${esc(ev.name_en)}</p>` : ''}
      <p class="desc">${esc(ev.description || '')}</p>
      <div class="facts">
        <div class="fact">${I.cal}<div><b>${esc(fmtAr(ev.date))}${ev.time ? ' — ' + esc(ev.time) : ''}</b><span class="en">${esc(fmtEn(ev.date))}</span></div></div>
        ${ev.venue_ar ? `<div class="fact">${I.pin}<div><b>${esc(ev.venue_ar)}</b><span class="en">${esc(ev.venue_en)}</span>
          ${map ? `<a href="${esc(map)}" target="_blank" rel="noopener">فتح الموقع على الخريطة ←</a>` : ''}</div></div>` : ''}
      </div>
    </section>
    <form class="panel form" id="f" novalidate>
      <h2>سجّل حضورك الآن</h2>
      <p class="sub">${isVip ? 'املأ النموذج لاستلام بطاقة الدخول فوراً' : 'املأ النموذج — يُراجع طلبك ثم تصلك بطاقة الدخول'}</p>
      <div class="formerr" id="err" hidden></div>
      <div class="field" data-k="name">${I.user}<input name="name" placeholder="الاسم الكامل" autocomplete="name" maxlength="120"></div>
      <div class="field" data-k="phone">${I.phone}<input name="phone" type="tel" inputmode="tel" placeholder="رقم الهاتف (091xxxxxxx)" autocomplete="tel" maxlength="20" dir="rtl"></div>
      <div class="field" data-k="email">${I.mail}<input name="email" type="email" placeholder="البريد الإلكتروني (اختياري)" autocomplete="email" maxlength="120"></div>
      <div class="field" data-k="title">${I.bag}<input name="title" placeholder="المسمى الوظيفي" autocomplete="organization-title" maxlength="120"></div>
      <div class="field" data-k="org">${I.org}<input name="org" placeholder="جهة العمل" autocomplete="organization" maxlength="120"></div>
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="group" data-k="gender"><label>الجنس</label>
        <div class="seg two" data-g="gender"><button type="button" data-v="m" aria-pressed="false">ذكر</button><button type="button" data-v="f" aria-pressed="false">أنثى</button></div></div>
      <div class="group" data-k="attend"><label>تأكيد الحضور</label>
        <div class="seg three" data-g="attend"><button type="button" data-v="yes" aria-pressed="false">أؤكد حضوري</button><button type="button" data-v="no" aria-pressed="false">لن أحضر</button><button type="button" data-v="maybe" aria-pressed="false">غير متأكد</button></div></div>
      <label class="consent" data-k="consent"><input type="checkbox" name="consent"> أوافق على شروط الخصوصية ومعالجة البيانات الشخصية وأقرّ بصحة المعلومات المقدمة</label>
      <button class="primary" id="go">تسجيل الحضور</button>
      <p class="note">${isVip ? 'رابط الدعوة شخصي ويُستخدم مرة واحدة' : 'بعد التسجيل ستحصل على رابط لمتابعة حالة طلبك'}</p>
    </form></div>`;

  app.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    state[seg.dataset.g] = b.dataset.v; seg.closest('.group').classList.remove('err');
  }));
  const f = document.getElementById('f');
  f.addEventListener('input', e => e.target.closest('.field')?.classList.remove('err'));
  f.addEventListener('submit', submit);
}

function validate(f){
  const v = Object.fromEntries(new FormData(f)), bad = [];
  const digits = (v.phone || '').replace(/\D/g, '');
  if ((v.name || '').trim().length < 3) bad.push('name');
  if (digits.length < 9 || digits.length > 15) bad.push('phone');
  if (v.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email.trim())) bad.push('email');
  if (!(v.title || '').trim()) bad.push('title');
  if (!(v.org || '').trim()) bad.push('org');
  if (!state.gender) bad.push('gender');
  if (!state.attend) bad.push('attend');
  if (!f.consent.checked) bad.push('consent');
  return { v, bad };
}

async function submit(e){
  e.preventDefault();
  const f = e.target, err = document.getElementById('err'), go = document.getElementById('go');
  f.querySelectorAll('.err').forEach(x => x.classList.remove('err'));
  const { v, bad } = validate(f);
  if (bad.length) {
    bad.forEach(k => f.querySelector(`[data-k="${k}"]`)?.classList.add('err'));
    err.textContent = 'يرجى استكمال الحقول المظللة بالأحمر.'; err.hidden = false;
    f.querySelector('.err')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return;
  }
  err.hidden = true; go.disabled = true; go.textContent = 'جاري التسجيل…';
  const body = { a: 'register', hp: v.website || '', f: { name: v.name, phone: v.phone, email: v.email, title: v.title, org: v.org,
                 gender: state.gender, attend: state.attend, consent: true } };
  if (VIP) body.v = VIP; else body.e = EV;
  try {
    const d = await API.post(body);
    if (d.ok && d.token) { store.set('mrg_last_' + (VIP || EV), d.token); return goBadge(d.token); }
    err.textContent = d.error === 'fields' ? 'تحقق من: ' + d.fields.join('، ')
      : d.error === 'closed' ? 'التسجيل مغلق لهذا الحدث.'
      : d.error === 'busy' ? d.msg : 'تعذّر التسجيل. حاول مرة أخرى.';
    err.hidden = false;
  } catch (_) { err.textContent = 'مشكلة في الاتصال. تأكد من الإنترنت وحاول مرة أخرى.'; err.hidden = false; }
  go.disabled = false; go.textContent = 'تسجيل الحضور';
}

(async () => {
  if (!API.configured()) return msg('الموقع غير مُعدّ', 'لم يتم ربط الموقع بالـ Google Sheet بعد.');
  if (!VIP && !EV) return msg('الرابط غير مكتمل', 'تأكد من الرابط المُرسل إليك.');
  if (VIP && !/^[a-f0-9]{32}$/.test(VIP)) return msg('رابط الدعوة غير صالح', 'تأكد من الرابط المُرسل إليك أو تواصل مع فريق التنظيم.');
  try {
    const d = await API.get(VIP ? { a: 'form', v: VIP } : { a: 'form', e: EV });
    if (d.ok && d.used) return d.token ? goBadge(d.token) : msg('الدعوة مستخدمة', 'تم التسجيل بهذه الدعوة مسبقاً.');
    if (d.ok) return render(d);
    if (d.error === 'void') return msg('الدعوة ملغاة', 'هذه الدعوة لم تعد صالحة. تواصل مع فريق التنظيم.');
    if (d.error === 'closed') return msg('التسجيل مغلق', 'التسجيل العام لهذا الحدث مغلق حالياً.');
    msg('الرابط غير صالح', 'تأكد من الرابط المُرسل إليك أو تواصل مع فريق التنظيم.');
  } catch (_) { msg('تعذّر التحميل', 'تأكد من اتصالك بالإنترنت ثم أعد فتح الرابط.'); }
})();
</script>
</body></html>
